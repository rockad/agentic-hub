[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "coordination"
version = "0.1.0"
description = "A2A 1.0.1 coordination server for side-by-side coding-agent sessions"
readme = "README.md"
requires-python = ">=3.14"  # dev box and image both 3.14
dependencies = [
    # Exact pin, decision D3. 1.3.0 is the release SP5 ran on and the only 1.3.x on PyPI.
    # Re-run the SP5 driver on every bump. S1-STORE adds the database extras: `postgresql` is
    # SQLAlchemy asyncio plus the asyncpg dialect, `db-cli` is Alembic (the SDK migration stream).
    "a2a-sdk[http-server,postgresql,db-cli]==1.3.0",
    "asyncpg>=0.32.0",  # S1-PG: the start-up connection check. 0.32.0 has cp314 manylinux wheels, SP5b ran it.
    "uvicorn>=0.54.0",
    # S1-AUTH: the start-up check reads and validates the cards file (spec 1.6). Was dev-only
    # (tests/test_compose.py also uses it); 6.0.3 has cp314 wheels, already in uv.lock.
    "pyyaml>=6",
]

[project.scripts]
a2a-coord = "coordination.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",  # Starlette's TestClient prefers it; httpx is deprecated there
    "mcp>=2.3.0",  # S1-MCP: the official client, used only by tests/test_mcp_e2e.py; the server does not import it
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hooks: hook and repo-dependent static security tests",
]
