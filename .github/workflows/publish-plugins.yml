name: Publish Plugins

# Interim artifact (pr-plan decision 12): publishes the vendored lookup image
# until cognitive-engine's native lookup replaces plugins/memory (RFC 005
# Phase C removes this workflow and ghcr.io/rockad/lookup).
#
# Publishes only on a `lookup-vX.Y.Z` tag or a manual dispatch. It never
# publishes `latest` and never runs on an ordinary push to main.
# Actions are pinned to commit SHAs (comment shows the tag they resolved from).

on:
  push:
    tags:
      - 'lookup-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lookup
            context: plugins/memory/servers/lookup
            image: ghcr.io/rockad/lookup

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=match,pattern=lookup-v(\d+\.\d+\.\d+),group=1
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest to pin in compose
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "Digest to pin in \`plugins/memory/.env\` as \`LOOKUP_DIGEST\`:"
            echo
            echo '```'
            echo "${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
