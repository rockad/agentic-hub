# The coordination test suite, run from a full checkout.
#
# Why: ci.yml runs no coordination tests, and the server image runs the suite while it builds
# (servers/coordination/Dockerfile) with only src/ and tests/ in the build context. There every test
# that needs a repository file (the hook scripts, compose, the cards file) or Docker is SKIPPED, so a
# green CI said nothing about the hooks: 102 Claude hook tests skipped and the AGY hook tests would
# have as well (Opus review of PR #94, 2026-11-23). This workflow runs them from the checkout and fails
# when a run skips what it should have run (scripts/check-pytest-skips.sh).
#
# Two parallel jobs:
#   1. the hook tests of both harnesses (static, listener, register and pending, agy), the settings reader
#      and the doctor (jq is installed for it): no skip allowed
#   2. the whole suite with Docker (A2A_TEST_REQUIRE_DOCKER=1 turns a missing Docker into a failure):
#      exactly three skips are expected, each covered by another job:
#        - tests/test_a2a_tck.py     needs the TCK checkout (job "A2A TCK against the coordination server")
#        - tests/test_backup_script.py  needs A2A_BACKUP_IMAGE (job "Build the coordination images ...")
#        - tests/test_compose.py     needs a running stack (the same image job)
#      A fourth skip, or fewer than three, fails the job, and so does a skip in any other module: the
#      fourth argument of check-pytest-skips.sh names the three modules (their pytest classnames).
#      Change the number and the list here with the test.
name: Coordination suite

on:
  pull_request:
    paths:
      - "plugins/coordination/**"
      - "scripts/check-pytest-skips.sh"
      - ".github/workflows/coordination-suite.yml"
  push:
    branches: [main]
    paths:
      - "plugins/coordination/**"
      - "scripts/check-pytest-skips.sh"
      - ".github/workflows/coordination-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    name: Hook & static-security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/coordination/servers/coordination
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Tools the hook tests need (dash, curl, shellcheck, jq)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash curl shellcheck jq
          dash -c 'echo dash ok'; curl --version | head -n 1; shellcheck --version | head -n 2; jq --version

      - name: Hook tests of both harnesses, no skip allowed
        env:
          A2A_TEST_REQUIRE_DOCKER: "1"
        run: |
          uv run pytest -q -rs -p no:cacheprovider -m hooks --junitxml="$RUNNER_TEMP/hooks.xml"
          bash "$GITHUB_WORKSPACE/scripts/check-pytest-skips.sh" "$RUNNER_TEMP/hooks.xml" 0 900

  suite:
    name: Coordination suite with Docker (excluding hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: plugins/coordination/servers/coordination
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: The remaining suite with Docker, only the three known skips
        env:
          A2A_TEST_REQUIRE_DOCKER: "1"
        run: |
          uv run pytest -q -rs -p no:cacheprovider -m "not hooks" --junitxml="$RUNNER_TEMP/all.xml"
          bash "$GITHUB_WORKSPACE/scripts/check-pytest-skips.sh" "$RUNNER_TEMP/all.xml" 3 1400 \
            "tests.test_a2a_tck tests.test_backup_script tests.test_compose"
