  # -- Our own extension fields -----------------------------------------------------------------------
  - test: tests.compatibility.core_operations.test_data_model.TestCamelCaseFieldNames::test_no_snake_case_keys
    decision: "server-api.md 5.3 (Task.metadata.coord.* names)"
    reason: >-
      DM-SERIAL-001. The check walks every key of the SendMessage response, including the free-form
      `metadata` Struct. Our extension block `metadata.coord` uses snake_case names that the spec
      table fixes (`expires_at`, `created_at`, `recipient_listening`); every A2A-defined field is
      camelCase. The test stops at the first transport that fails, so there is one entry, not two.
    review: proposed

  # -- Defect in the TCK at this commit -----------------------------------------------------------------
  - test: tests.compatibility.core_operations.test_requirements::test_must_requirement[CORE-SEND-003-jsonrpc]
    decision: "TCK defect at 104a7b4 (requirement CORE-SEND-003 sets no expected_error); server-api.md 3.3.2"
    reason: >-
      The requirement says an unsupported part media type MUST give ContentTypeNotSupportedError,
      but its definition in tck/requirements/core_operations.py sets no `expected_error`, so the
      generic test treats any error response as "Operation failed". Our server returns -32005, the
      error the requirement asks for, and the test reports that as the failure. Our own tests
      cover the behaviour (tests/test_a2a_jsonrpc.py). When the TCK is fixed this entry is reported
      stale and must be removed.
    review: proposed
  - test: tests.compatibility.core_operations.test_requirements::test_must_requirement[CORE-SEND-003-http_json]
    decision: "TCK defect at 104a7b4 (requirement CORE-SEND-003 sets no expected_error); server-api.md 3.3.2"
    reason: As for the JSON-RPC entry above; over REST our server answers 400 with the ContentTypeNotSupported error.
    review: proposed

  # -- Open point, not a decided deviation ------------------------------------------------------------------
  - test: tests.compatibility.http_json.test_problem_details.TestHttpJsonErrorMediaType::test_error_content_type
    decision: "none yet: an open point for the reviewer"
    reason: >-
      HTTP_JSON-SVC-001, SHOULD level. The TCK wants error responses in `application/a2a+json`.
      Ours are `application/json` with an AIP-193 body, and the spec text the TCK ships
      (specification/specification.md, v1.0.1, section 6.4 example) shows `application/problem+json`
      for a version error. The two sources disagree, so no media type was changed. Decide one and
      either fix it (`_error` in a2a/rest.py) or keep this entry.
    review: proposed
