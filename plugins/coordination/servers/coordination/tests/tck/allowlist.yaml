  - test: tests.compatibility.core_operations.test_artifacts.TestTextArtifact::test_task_has_text_artifact[jsonrpc]
    decision: "AGENTS.md security invariants (tasks are parked, never auto-executed); server-api.md 3.3.2"
    reason: >-
      DM-ART-001. The TCK expects the SUT to answer a prompt with a task that carries a text
      artifact. Our server only parks a task for a live session; it never runs it, so the task has
      no artifacts when it is returned. A real session may add artifacts later; the TCK cannot
      drive that.
