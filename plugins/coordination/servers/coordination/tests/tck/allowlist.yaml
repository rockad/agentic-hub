  # -- Defect in the TCK at this commit -----------------------------------------------------------------
  - test: tests.compatibility.core_operations.test_requirements::test_must_requirement[CORE-SEND-003-jsonrpc]
    decision: "TCK defect at 104a7b4 (requirement CORE-SEND-003 sets no expected_error); server-api.md 3.3.2"
    reason: >-
      The requirement says an unsupported part media type MUST give ContentTypeNotSupportedError,
      but its definition in tck/requirements/core_operations.py sets no `expected_error`, so the
      generic test treats any error response as "Operation failed". Our server returns -32005, the
      error the requirement asks for, and the test reports that as the failure. Our own tests
      cover the behaviour (tests/test_a2a_jsonrpc.py). The main session confirmed this TCK defect on
      2026-11-16 (the requirement sets no `expected_error` at 104a7b4, also upstream HEAD that day;
      `_validate_response` in tests/compatibility/core_operations/test_requirements.py then treats
      any error as a failure). When the TCK is fixed this entry is reported stale and must be removed.
    review: reviewed
  - test: tests.compatibility.core_operations.test_requirements::test_must_requirement[CORE-SEND-003-http_json]
    decision: "TCK defect at 104a7b4 (requirement CORE-SEND-003 sets no expected_error); server-api.md 3.3.2"
    reason: >-
      As for the JSON-RPC entry above; over REST our server answers 400 with the
      ContentTypeNotSupported error. The main session confirmed the TCK defect on 2026-11-16:
      in tck/requirements/core_operations.py at 104a7b4 (also upstream HEAD that day) CORE-SEND-003
      sets no `expected_error`, so `_validate_response` in
      tests/compatibility/core_operations/test_requirements.py treats any error as a failure.
    review: reviewed

  # -- Two TCK tests that contradict each other on the REST error media type -------------------------
  - test: tests.compatibility.core_operations.test_error_handling.TestRestErrorStructure::test_error_uses_aip193_format
    decision: "A2A 1.0.1 section 11.1 and the 11.6 error example (user review, 2026-11-16): REST errors are application/a2a+json"
    reason: >-
      HTTP_JSON-ERR-001 (MUST). Found by the first real run after the media type change; it was hidden
      before, because the old `application/json` passed it. The test checks `"application/json" in
      content-type`, which `application/a2a+json` can never satisfy, while the TCK's own
      HTTP_JSON-SVC-001 test (SHOULD, test_problem_details.py) requires `application/a2a+json` for the
      same response. At 104a7b4 no response passes both. The body is the AIP-193 `error` object the test
      goes on to check. Proposed by the builder: the user has not reviewed this entry. The alternative
      is to serve `application/json` again and list HTTP_JSON-SVC-001 instead (a SHOULD).
    review: proposed
