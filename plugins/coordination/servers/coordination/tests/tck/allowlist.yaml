# Reviewed deviations from the A2A TCK (a2aproject/a2a-tck at the commit below).
#
# Rule (plan section 4.2, S1-A2A acceptance): a TCK failure that is not listed here blocks. A listed
# test that does not fail also blocks (it is stale: remove it). Each entry is one exact test id
# (JUnit `classname::name`, as the gate prints it), no wildcards.
#
# review: proposed  = written by the builder from a real run, not yet signed off.
# review: reviewed  = the user has read the entry and accepts the deviation.
# The user reviewed this list on 2026-11-16: 12 entries are `reviewed`. Two entries of the first
# run were removed because the cause was fixed, not allowed: the REST error media type (REST errors
# are now `application/a2a+json`) and the snake_case `metadata.coord` keys (now camelCase, Z16). The
# run after those fixes showed one more failure, HTTP_JSON-ERR-001, added as `proposed` (last entry,
# not yet reviewed). A new entry starts as `proposed`. The gate does not read `review` as a pass or a fail; it keeps the state
# visible (the TCK test prints how many entries are unreviewed).
#
# How the TCK is run, so the entries can be read: tests/test_a2a_tck.py serves the real app behind a
# test-only front that adds the API key and the tenant and serves one member card at the root card
# path (the TCK has no option for any of that). The blocking cap is 2 s in that run (production: 60 s,
# decision 22), so the TCK's blocking sends return the parked task quickly.
#
# Not listed because they are skipped by the TCK, not failed (counts in docs/specs/a2a.md section 7):
# streaming and push (cards declare both false, D35), gRPC (not served), and every test whose
# precondition is a task that reaches COMPLETED or INPUT_REQUIRED (tasks are parked: nothing behind
# the server runs them; this includes the effect of the 60 s blocking cap, D22). A skip is a coverage
# gap, not a pass.
