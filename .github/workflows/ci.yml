name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Manifests
        run: bun run scripts/validate-manifests.ts

      - name: Check Standalone Skills Are In Claude Marketplace
        run: bash scripts/check-skills-marketplace.sh

      - name: Check Public Leaks
        run: |
          command -v rg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ripgrep; }
          bash scripts/check-public-leaks.sh

      - name: Test Public Leaks Guard
        run: bash scripts/test-check-public-leaks.sh

      - name: Check Clarify Skill Guard
        run: bash scripts/check-clarify-skill.sh

      - name: Test Clarify Stop Hook
        run: bash scripts/test-clarify-stop-hook.sh

      - name: Test Clarify Next Reminder
        run: bash scripts/test-clarify-next-reminder.sh

      - name: Test Jev Plugin
        run: |
          cd plugins/jev
          bun install --frozen-lockfile || bun install
          bun run test

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Test Local Transcribe Plugin
        run: |
          uv run --with numpy --with imageio-ffmpeg python3 -m unittest discover -s plugins/local-transcribe/evals -p "*test*.py"

      - name: Test Lookup Engine
        run: |
          cd plugins/memory/servers/lookup
          uv run python3 -m unittest discover -s tests -p "*test*.py"

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "$url" -o "$tmpdir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tmpdir/$archive" | sha256sum -c -
          install -d "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$tmpdir/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

      - name: Run gitleaks (PR commit range)
        if: github.event_name == 'pull_request'
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
